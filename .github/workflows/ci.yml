name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job on purpose. Granularity belongs in the flake's `checks.*`
  # attributes, which `nix flake check` evaluates in parallel with build
  # caching. Splitting these into separate GitHub jobs would duplicate that
  # scheduling and lose cache sharing between them.
  #
  # Add a second job ONLY for work the Nix sandbox cannot do: network access,
  # a real PTY/TTY, artifact upload, or a different runner OS.
  #
  # The macOS entry in the matrix below is exactly that exception. cl-cli
  # declares aarch64-darwin in `systems`, and `nix flake check` only evaluates
  # the outputs for the system it happens to run on, so the Linux runner can
  # never verify the Darwin outputs. This stays one job definition: the
  # granularity is still `checks.*`, the matrix only supplies the second OS.
  check:
    name: nix flake check (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # Never let a Linux failure hide a Darwin-only one, or the reverse.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Runs the SBCL test suite (checks.default), the ECL suite (checks.ecl),
      # the treefmt formatting gate (checks.formatting), and the mkdocs
      # --strict build (checks.docs).
      #
      # No `--all-systems`: the flake declares two systems, but the outputs of
      # the other one cannot be *built* from here, only evaluated. The matrix
      # runner covers it for real instead.
      #
      # The outer alarm is the one that survives a hung builder holding the
      # step open; `timeout-minutes` alone can leave the job wedged.
      - name: Check flake
        timeout-minutes: 40
        run: perl -e 'alarm 2280; exec @ARGV' -- nix flake check --print-build-logs

      # Catches stray conflict markers and whitespace errors that compile fine.
      - name: Check diff hygiene
        run: git diff --check
