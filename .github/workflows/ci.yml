name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job on purpose. Granularity belongs in the flake's `checks.*`
  # attributes, which `nix flake check` evaluates in parallel with build
  # caching. Splitting these into separate GitHub jobs would duplicate that
  # scheduling and lose cache sharing between them.
  #
  # Add a second job ONLY for work the Nix sandbox cannot do: network access,
  # a real PTY/TTY, or artifact upload.
  #
  # There is no matrix. As of the 2026-08-01 revision the flake declares
  # `systems = [ "x86_64-linux" ]` and nothing else, so a second runner OS has
  # no outputs to verify. A one-entry matrix would keep signalling that another
  # platform is a one-line addition here, which is exactly the decision that
  # was reversed. See PACKAGE_STANDARD.md, the CI granularity section.
  check:
    name: nix flake check (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Runs the SBCL test suite (checks.default), the ECL suite (checks.ecl),
      # the treefmt formatting gate (checks.formatting), the mkdocs --strict
      # build (checks.docs), and the structural S-expression gate
      # (checks.paredit-lint). All of them are generated or declared by
      # cl-nix-forge's mkPackageFlake in flake.nix, which is where a new one
      # goes -- not into a second job here.
      #
      # No `--all-systems`: the flake declares exactly one system, so the flag
      # would not widen what is checked.
      #
      # The outer alarm is the one that survives a hung builder holding the
      # step open; `timeout-minutes` alone can leave the job wedged.
      - name: Check flake
        timeout-minutes: 40
        run: perl -e 'alarm 2280; exec @ARGV' -- nix flake check --print-build-logs

      # Catches stray conflict markers and whitespace errors that compile fine.
      - name: Check diff hygiene
        run: git diff --check

  # Second job, per this file's own rule above: artifact upload is one of the
  # three sanctioned reasons. `checks.coverage` (flake.nix) already builds
  # inside `check`'s `nix flake check` above, but that job only asserts the
  # report is non-empty and discards the store path -- nobody can actually
  # open `cover-index.html` afterward. This job re-resolves the same,
  # content-addressed, already-cached derivation (a Cachix hit, not a
  # rebuild) and publishes it as a downloadable artifact, which is the only
  # way to read a coverage report on a machine that cannot `nix build`
  # `x86_64-linux` outputs itself -- see this repo's own
  # `docs/src/reference/compatibility.md#platforms`.
  coverage-artifact:
    name: Publish coverage report artifact
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Copies out of /nix/store rather than uploading the store path
      # directly: upload-artifact needs an ordinary writable, relative path,
      # and a store path is neither.
      - name: Build coverage report
        run: |
          set -euo pipefail
          out="$(nix build .#checks.x86_64-linux.coverage --no-link --print-out-paths)"
          mkdir -p coverage-report
          cp -r "$out"/. coverage-report/
          chmod -R u+w coverage-report

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-report
          retention-days: 30
