# cl-cli documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build --strict -f docs/mkdocs.yml
# Serve:   mkdocs serve --no-strict -f docs/mkdocs.yml
# The Nix flake (`nix build .#docs`) drives the same config offline.
#
# Always start mkdocs from the REPOSITORY ROOT.

# Broken links and pages missing from the nav are build failures. It is set
# here as well as passed on the command line so that every invocation path
# gets the same verdict.
strict: true

site_name: cl-cli
site_description: >-
  A dependency-light Common Lisp CLI toolkit — strict parsing, subcommand
  dispatch, help, shell completion, and offline documentation generation from
  a single app spec.
site_author: cl-cli contributors
site_url: https://nerima-lisp.github.io/cl-cli/

repo_name: nerima-lisp/cl-cli
repo_url: https://github.com/nerima-lisp/cl-cli
edit_uri: edit/main/docs/src/

# Content lives in docs/src, matching cl-weave's docs layout.
docs_dir: src
site_dir: ../site
use_directory_urls: true

copyright: Copyright &copy; cl-cli contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/console-line
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-cli
      name: cl-cli on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. the Nix / ASDF / Quicklisp install paths).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols, emoji.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

# The six sections and their order are fixed by DOCS_STANDARD.md. They track
# reader state: Getting Started has not run anything yet, Guide has it working
# but does not know the design, Reference is looking up one answer, Internals
# is about to change something, Project is about to contribute. Readership
# falls off along that axis, so reference and internals stay at the back.
#
# Guide topics are ordered by dependency, not alphabetically: later pages use
# the vocabulary the earlier ones introduce.
nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
  - Guide:
      - Option Values and Kinds: option-values.md
      - Option Relations and Grouping: option-relations.md
      - Commands and Dispatch: commands.md
      - Validation and Exit Codes: validation.md
      - CLI Behavior: cli-behavior.md
      - Shell Completion: shell-completion.md
      - Documentation Generation: documentation-generation.md
      - Migration Guide: migration-guide.md
  - Reference:
      - API Reference: api-reference.md
      - Compatibility: compatibility.md
  - Internals:
      - Scope and Non-Goals: scope.md
  - Project:
      - Development: development.md

not_in_nav: |
  notes/
