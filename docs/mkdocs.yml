# cl-cli documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve  -f docs/mkdocs.yml
# The Nix flake (`nix build .#docs`) drives the same config offline.

site_name: cl-cli
site_description: >-
  A dependency-light Common Lisp CLI toolkit — strict parsing, subcommand
  dispatch, help, shell completion, and offline documentation generation from
  a single app spec.
site_author: cl-cli contributors
site_url: https://nerima-lisp.github.io/cl-cli/

repo_name: nerima-lisp/cl-cli
repo_url: https://github.com/nerima-lisp/cl-cli
edit_uri: edit/main/docs/src/

# Content lives in docs/src, matching cl-weave's docs layout.
docs_dir: src
site_dir: ../site
use_directory_urls: true

copyright: Copyright &copy; cl-cli contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/console-line
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-cli
      name: cl-cli on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  # Content tabs (e.g. the Nix / ASDF / Quicklisp install paths).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols, emoji.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: README.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
  - Guide:
      - Option Values and Kinds: option-values.md
      - Option Relations and Grouping: option-relations.md
      - Commands and Dispatch: commands.md
      - Validation and Exit Codes: validation.md
      - CLI Behavior: cli-behavior.md
      - Shell Completion: shell-completion.md
      - Documentation Generation: documentation-generation.md
  - Reference:
      - API Reference: api-reference.md
      - Migration Guide: migration-guide.md
      - Scope and Non-Goals: scope.md
  - Governance:
      - Contributing: contributing.md
      - Support: support.md
      - Security: security.md
      - Release Process: releasing.md
      - Code of Conduct: code-of-conduct.md
